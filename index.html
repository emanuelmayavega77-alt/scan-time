<!doctype html>
<html lang="es">
<head>

<title>Lector QR - Scan Time</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="styles/lector qr.css">



</head>
<body>

  

<h2>Lector QR - Scan Time</h2>

<div id="lector"></div>

<div id="resultados">
