<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lector QR - Scan Time</title>

<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>




</head>
  <style>
  body{
  font-family:Arial,sans-serif;
  background:#e0f7fa;
  padding:20px;
  text-align:center;
}

#lector{
  margin:20px auto;
  max-width:400px;
}

#resultados{
  margin-top:20px;
  background:white;
  padding:15px;
  border-radius:10px;
  max-width:400px;
  margin-left:auto;
  margin-right:auto;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
  text-align:left;
}

#foto{
  width:120px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  display:none;
  margin:10px auto;
}

button{
  padding:10px;
  margin-top:15px;
  border:none;
  border-radius:8px;
  background:#00796b;
  color:white;
  cursor:pointer;
}

.ok{color:green;font-weight:bold;}
.fail{color:red;font-weight:bold;}
    </style>
  
<script>
  function logout(){

  sessionStorage.removeItem("user");

  window.location.href = "login.html";

}
  // ================= CONFIG =================
const SUPABASE_URL = "TU_URL";
const SUPABASE_ANON_KEY = "TU_KEY";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const lector = new Html5Qrcode("lector");

// ================= MOSTRAR MENSAJES =================
function mostrar(msg, ok) {
  const estado = document.getElementById("estado");
  estado.textContent = msg;
  estado.className = ok ? "ok" : "fail";
}


// ================= BUSCAR =================
async function obtenerEstudiante(documento) {
  const { data } = await supabaseClient
    .from("estudiantes_qr")
    .select("*")
    .eq("documento", documento)
    .single();

  return data;
}

// ================= GUARDAR =================
async function guardarAsistencia(est) {
  await supabaseClient.from("registros_qr").insert([{
    nombre: est.nombre,
    grado: est.grado,
    documento: est.documento,
    foto_url: est.foto_url,
    fecha_hora: new Date().toISOString(),
    estado: "Registro correcto"
  }]);
}

// ================= PROCESAR =================
async function procesarQR(qr) {

  await lector.stop();

  const documento = qr;

  const estudiante = await obtenerEstudiante(documento);

  if (!estudiante) {
    mostrar("❌ No encontrado", false);
    return;
  }

  document.getElementById("nombre").textContent = estudiante.nombre;
  document.getElementById("grado").textContent = estudiante.grado;
  document.getElementById("doc").textContent = estudiante.documento;
  document.getElementById("hora").textContent = new Date().toLocaleString();

  if (estudiante.foto_url) {
    document.getElementById("foto").src = estudiante.foto_url;
    document.getElementById("foto").style.display = "block";
  }

  await guardarAsistencia(estudiante);

  mostrar("✅ Asistencia registrada", true);

  document.getElementById("btnReiniciar").style.display = "block";
}

// ================= CÁMARA =================
async function iniciarCamara() {
  await lector.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    procesarQR
  );

  mostrar("📷 Cámara lista", true);
}

// ================= REINICIAR =================
function reiniciarLectura() {
  location.reload();
}

// ================= START =================
iniciarCamara();
  </script>

<body>
  
<h2>Lector QR - Scan Time</h2>

<div id="lector"></div>

<div id="resultados">
  <p><strong>Nombre:</strong> <span id="nombre"></span></p>
  <p><strong>Grado:</strong> <span id="grado"></span></p>
  <p><strong>Documento:</strong> <span id="doc"></span></p>
  <p><strong>Hora:</strong> <span id="hora"></span></p>
  <p id="estado"></p>

  <button id="btnReiniciar" style="display:none;" onclick="reiniciarLectura()">
    Escanear siguiente QR
  </button>
</div>


</body>
</html>
